name: Update ArXiv Papers

on:
  schedule:
    # Single daily run near end-of-day Chicago time:
    # 06:10 UTC = 00:10 CST (UTC-6) / 01:10 CDT (UTC-5)
    - cron: '10 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch papers for (YYYY-MM-DD format, optional)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch ArXiv papers (default to America/Chicago local date)
        id: fetch_papers
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date }}"
            if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Error: Invalid date format. Use YYYY-MM-DD."
              exit 1
            fi
          else
            TARGET_DATE=$(TZ=America/Chicago date '+%Y-%m-%d')
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

          python scripts/arxiv_fetcher.py "$TARGET_DATE"

          if [ -f "data/${TARGET_DATE}.json" ]; then
            echo "papers_found=true" >> "$GITHUB_OUTPUT"
            echo "Papers found and JSON file created for ${TARGET_DATE}"
          else
            echo "papers_found=false" >> "$GITHUB_OUTPUT"
            echo "No papers found for ${TARGET_DATE}, skipping commit"
          fi

      - name: Generate static site
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/generate_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit and push data files
        if: ${{ steps.fetch_papers.outputs.papers_found == 'true' }}
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ site/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ArXiv papers data - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
