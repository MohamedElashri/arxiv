name: Update ArXiv Papers

on:
  schedule:
    # Run at 23:50 America/Chicago daily (DST-safe via two UTC crons; guard step below selects the right one)
    - cron: '50 4 * * *'  # 23:50 CDT (UTC-5)
    - cron: '50 5 * * *'  # 23:50 CST (UTC-6)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch papers for (YYYY-MM-DD format, optional)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Guard: only proceed at 23:50 America/Chicago or on manual run
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_job=true" >> "$GITHUB_OUTPUT"
          else
            hhmm=$(TZ=America/Chicago date +%H%M)
            if [ "$hhmm" = "2350" ]; then
              echo "run_job=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_job=false" >> "$GITHUB_OUTPUT"
              echo "Not the intended local time; skipping."
            fi
          fi

      - name: Checkout repository
        if: ${{ steps.guard.outputs.run_job == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        if: ${{ steps.guard.outputs.run_job == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ steps.guard.outputs.run_job == 'true' }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directory
        if: ${{ steps.guard.outputs.run_job == 'true' }}
        run: mkdir -p data

      - name: Fetch ArXiv papers (default to America/Chicago local date)
        if: ${{ steps.guard.outputs.run_job == 'true' }}
        id: fetch_papers
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date }}"
          else
            TARGET_DATE=$(TZ=America/Chicago date '+%Y-%m-%d')
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

          python scripts/arxiv_fetcher.py "$TARGET_DATE"

          if [ -f "data/${TARGET_DATE}.json" ]; then
            echo "papers_found=true" >> "$GITHUB_OUTPUT"
            echo "Papers found and JSON file created for ${TARGET_DATE}"
          else
            echo "papers_found=false" >> "$GITHUB_OUTPUT"
            echo "No papers found for ${TARGET_DATE}, skipping commit"
          fi

      - name: Generate static site
        if: ${{ steps.guard.outputs.run_job == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/generate_site.py

      - name: Setup Pages
        if: ${{ steps.guard.outputs.run_job == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: ${{ steps.guard.outputs.run_job == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        if: ${{ steps.guard.outputs.run_job == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit and push data files
        if: ${{ steps.guard.outputs.run_job == 'true' && steps.fetch_papers.outputs.papers_found == 'true' }}
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ || true
          git add site/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ArXiv papers data - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
