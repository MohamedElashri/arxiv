name: Update ArXiv Papers

on:
  schedule:
    # Run at 23:55 America/Chicago daily (DST-safe via two UTC crons)
    - cron: '55 4 * * *'  # 23:55 CDT (UTC-5)
    - cron: '55 5 * * *'  # 23:55 CST (UTC-6)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch papers for (YYYY-MM-DD format, optional)'
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    # If your "github-pages" environment has required reviewers, scheduled runs will stall.
    # Either remove protection on that environment or omit the environment key entirely.
    # environment: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve target date (America/Chicago)
        id: date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date }}"
            [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "invalid date"; exit 1; }
          else
            TARGET_DATE=$(TZ=America/Chicago date '+%Y-%m-%d')
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Using TARGET_DATE=$TARGET_DATE"

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch ArXiv papers
        id: fetch_papers
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/arxiv_fetcher.py "${{ steps.date.outputs.target_date }}"
          if [ -f "data/${{ steps.date.outputs.target_date }}.json" ]; then
            echo "papers_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "papers_found=false" >> "$GITHUB_OUTPUT"
          fi

      # Commit data FIRST so the site is generated from the committed state.
      - name: Commit data files (if any)
        if: ${{ steps.fetch_papers.outputs.papers_found == 'true' }}
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: arXiv ${ { steps.date.outputs.target_date } }"
            git push
          fi

      - name: Generate static site
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Surface TARGET_DATE to your generator in case it needs it.
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: |
          python scripts/generate_site.py --date "${TARGET_DATE}" || python scripts/generate_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        # If you keep the environment, add: environment: github-pages
