name: Update ArXiv Papers

on:
  schedule:
    # Run at 23:55 America/Chicago daily (DST-safe via two UTC crons)
    - cron: '55 4 * * *'  # 23:55 CDT (UTC-5)
    - cron: '55 5 * * *'  # 23:55 CST (UTC-6)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch papers for (YYYY-MM-DD format, optional)'
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve target date (America/Chicago)
        id: date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date }}"
            [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Invalid date (use YYYY-MM-DD)"; exit 1; }
          else
            # ArXiv announces at 20:00 ET (19:00 Chicago). Running at 23:55 Chicago means
            # we should fetch tomorrow's papers since today's announcement already happened.
            TARGET_DATE=$(TZ=America/Chicago date -d '+1 day' '+%Y-%m-%d')
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Using TARGET_DATE=$TARGET_DATE"

      - name: Create data directory
        shell: bash
        run: mkdir -p data

      - name: Fetch ArXiv papers
        id: fetch_papers
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/arxiv_fetcher.py "${{ steps.date.outputs.target_date }}"
          if [ -f "data/${{ steps.date.outputs.target_date }}.json" ]; then
            echo "papers_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "papers_found=false" >> "$GITHUB_OUTPUT"
          fi

      # Option B: pass TARGET_DATE via env and use Bash expansion
      # Commit data FIRST so the site build and artifact reflect committed state.
      - name: Commit data files (if any)
        if: ${{ steps.fetch_papers.outputs.papers_found == 'true' }}
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: arXiv ${TARGET_DATE}"
            git push
          fi

      - name: Generate static site
        env:
          PYTHONPATH: ${{ github.workspace }}
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        shell: bash
        run: |
          # Prefer explicit date if your generator supports it
          if python scripts/generate_site.py --date "${TARGET_DATE}"; then
            echo "Site generated for ${TARGET_DATE}"
          else
            echo "Generator did not accept --date; running default"
            python scripts/generate_site.py
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
