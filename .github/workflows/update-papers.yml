name: Update ArXiv Papers

on:
  schedule:
    # - cron: '30 1 * * *'  # 20:30 CDT (UTC-5)
    - cron: '30 2 * * *'  # 20:30 CST (UTC-6)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch papers for (YYYY-MM-DD format, optional)'
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # sanad: ref=v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve target date (America/Chicago)
        id: date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date }}"
            [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Invalid date (use YYYY-MM-DD)"; exit 1; }
          else
            # ArXiv papers announced today have yesterday's submission date
            TARGET_DATE=$(TZ=America/Chicago date -d 'yesterday' '+%Y-%m-%d')
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Using TARGET_DATE=$TARGET_DATE"

      - name: Install Nida
        shell: bash
        run: bash scripts/install-nida.sh

      - name: Fetch ArXiv papers
        id: fetch_papers
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/arxiv_fetcher.py "${{ steps.date.outputs.target_date }}"
          if [ -f "data/${{ steps.date.outputs.target_date }}.json" ]; then
            echo "papers_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "papers_found=false" >> "$GITHUB_OUTPUT"
          fi

      # Option B: pass TARGET_DATE via env and use Bash expansion
      # Commit data FIRST so the site build and artifact reflect committed state.
      - name: Commit data files (if any)
        if: ${{ steps.fetch_papers.outputs.papers_found == 'true' }}
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: arXiv ${TARGET_DATE}"
            git push
          fi

      - name: Cache the embedding model and paper vectors
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # sanad: ref=v5.0.5
        with:
          path: .nida/models
          key: arxiv-semantic-v1-${{ runner.os }}-${{ hashFiles('scripts/prepare_feed.py', 'requirements.txt', 'data/*.json') }}
          restore-keys: arxiv-semantic-v1-${{ runner.os }}-

      - name: Prepare, validate, and build with Nida
        shell: bash
        run: |
          python -m unittest discover -s tests
          python scripts/prepare_feed.py
          nida check
          nida build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # sanad: ref=v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # sanad: ref=v5.0.0
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # sanad: ref=v5.0.1
