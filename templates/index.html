<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_title }}</title>
    <meta name="description" content="{{ site_description }}">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- MathJax Configuration for Complete LaTeX Support -->
    <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true,
        processRefs: true,
        packages: {
          '[+]': ['ams', 'newcommand', 'configmacros', 'action', 'bbox', 'boldsymbol', 'braket', 'cancel', 'color', 'enclose', 'extpfeil', 'html', 'mhchem', 'unicode', 'verb', 'physics', 'textmacros', 'cases', 'empheq', 'gensymb']
        },
        macros: {
          // Common physics and math macros
          '\\RR': '\\mathbb{R}',
          '\\CC': '\\mathbb{C}',
          '\\NN': '\\mathbb{N}',
          '\\ZZ': '\\mathbb{Z}',
          '\\QQ': '\\mathbb{Q}',
          '\\dd': '\\mathrm{d}',
          '\\ee': '\\mathrm{e}',
          '\\ii': '\\mathrm{i}',
          '\\ket': ['\\left|#1\\right\\rangle', 1],
          '\\bra': ['\\left\\langle#1\\right|', 1],
          '\\braket': ['\\left\\langle#1\\right\\rangle', 1],
          '\\norm': ['\\left\\|#1\\right\\|', 1],
          '\\abs': ['\\left|#1\\right|', 1],
          '\\tr': '\\operatorname{tr}',
          '\\Tr': '\\operatorname{Tr}',
          '\\rank': '\\operatorname{rank}',
          '\\span': '\\operatorname{span}',
          '\\dim': '\\operatorname{dim}',
          '\\det': '\\operatorname{det}',
          '\\sgn': '\\operatorname{sgn}',
          '\\diag': '\\operatorname{diag}',
          '\\Re': '\\operatorname{Re}',
          '\\Im': '\\operatorname{Im}',
          '\\Arg': '\\operatorname{Arg}',
          '\\Log': '\\operatorname{Log}',
          '\\lcm': '\\operatorname{lcm}',
          '\\gcd': '\\operatorname{gcd}',
          '\\ord': '\\operatorname{ord}',
          '\\deg': '\\operatorname{deg}',
          '\\ker': '\\operatorname{ker}',
          '\\hom': '\\operatorname{hom}',
          '\\end': '\\operatorname{end}',
          '\\aut': '\\operatorname{aut}',
          '\\inn': '\\operatorname{inn}',
          '\\out': '\\operatorname{out}',
          '\\Fix': '\\operatorname{Fix}',
          '\\Stab': '\\operatorname{Stab}',
          '\\Orb': '\\operatorname{Orb}',
          '\\supp': '\\operatorname{supp}',
          '\\cl': '\\operatorname{cl}',
          '\\interior': '\\operatorname{int}',
          '\\bd': '\\operatorname{bd}',
          '\\grad': '\\nabla',
          '\\curl': '\\nabla\\times',
          '\\divergence': '\\nabla\\cdot',
          '\\laplacian': '\\nabla^2',
          '\\dalembertian': '\\Box',
          '\\slashed': ['\\cancel{#1}', 1],
          '\\order': ['\\mathcal{O}\\left(#1\\right)', 1],
          '\\bigO': ['\\mathcal{O}\\left(#1\\right)', 1],
          '\\littleo': ['o\\left(#1\\right)', 1],
          '\\Theta': ['\\Theta\\left(#1\\right)', 1],
          '\\Omega': ['\\Omega\\left(#1\\right)', 1],
          '\\expect': ['\\left\\langle#1\\right\\rangle', 1],
          '\\expectation': ['\\mathbb{E}\\left[#1\\right]', 1],
          '\\var': ['\\operatorname{Var}\\left[#1\\right]', 1],
          '\\cov': ['\\operatorname{Cov}\\left[#1,#2\\right]', 2],
          '\\prob': ['\\mathbb{P}\\left(#1\\right)', 1],
          '\\given': '\\mid',
          '\\st': '\\mid',
          '\\defeq': '\\stackrel{\\text{def}}{=}',
          '\\eqdef': '\\stackrel{\\text{def}}{=}',
          '\\approxeq': '\\stackrel{\\text{approx}}{=}',
          '\\propto': '\\varpropto',
          '\\const': '\\text{const}',
          '\\half': '\\frac{1}{2}',
          '\\third': '\\frac{1}{3}',
          '\\quarter': '\\frac{1}{4}',
          '\\inv': ['^{-1}'],
          '\\trans': ['^{\\top}'],
          '\\adj': ['^{\\dagger}'],
          '\\conj': ['^{*}'],
          '\\dual': ['^{\\vee}'],
          '\\perp': '\\bot',
          '\\parallel': '\\|',
          '\\nparallel': '\\nparallel',
          '\\independent': '\\perp\\!\\!\\!\\perp',
          '\\iid': '\\stackrel{\\text{iid}}{\\sim}',
          '\\dist': '\\stackrel{\\text{d}}{=}',
          '\\convd': '\\stackrel{\\text{d}}{\\to}',
          '\\convp': '\\stackrel{\\text{p}}{\\to}',
          '\\convas': '\\stackrel{\\text{a.s.}}{\\to}',
          '\\convL': ['\\stackrel{L^{#1}}{\\to}', 1],
          '\\weak': '\\rightharpoonup',
          '\\strong': '\\rightarrow',
          '\\floor': ['\\left\\lfloor#1\\right\\rfloor', 1],
          '\\ceil': ['\\left\\lceil#1\\right\\rceil', 1],
          '\\round': ['\\left\\lfloor#1\\right\\rceil', 1],
          '\\set': ['\\left\\{#1\\right\\}', 1],
          '\\Set': ['\\left\\{#1\\,\\middle|\\,#2\\right\\}', 2],
          '\\card': ['\\left|#1\\right|', 1],
          '\\powerset': ['\\mathcal{P}\\left(#1\\right)', 1],
          '\\range': ['\\operatorname{range}\\left(#1\\right)', 1],
          '\\domain': ['\\operatorname{domain}\\left(#1\\right)', 1],
          '\\codomain': ['\\operatorname{codomain}\\left(#1\\right)', 1],
          '\\image': ['\\operatorname{image}\\left(#1\\right)', 1],
          '\\preimage': ['\\operatorname{preimage}\\left(#1\\right)', 1]
        },
        tags: 'ams',
        tagSide: 'right',
        tagIndent: '0.8em',
        multlineWidth: '85%',
        useLabelIds: true,
        maxMacros: 10000,
        maxBuffer: 5120
      },
      chtml: {
        scale: 1,
        minScale: 0.5,
        matchFontHeight: false,
        displayAlign: 'center',
        displayIndent: '0',
        fontURL: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/output/chtml/fonts/woff-v2'
      },
      svg: {
        scale: 1,
        minScale: 0.5,
        matchFontHeight: false,
        displayAlign: 'center',
        displayIndent: '0',
        fontCache: 'local'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        includeHtmlTags: ['div', 'span', 'p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6'],
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process',
        renderActions: {
          addMenu: [0, '', '']
        }
      },
      loader: {
        load: ['[tex]/ams', '[tex]/newcommand', '[tex]/configmacros', '[tex]/action', '[tex]/bbox', '[tex]/boldsymbol', '[tex]/braket', '[tex]/cancel', '[tex]/color', '[tex]/enclose', '[tex]/extpfeil', '[tex]/html', '[tex]/mhchem', '[tex]/unicode', '[tex]/verb', '[tex]/physics', '[tex]/textmacros', '[tex]/cases', '[tex]/empheq', '[tex]/gensymb']
      },
      startup: {
        ready: function () {
          console.log('MathJax is loaded and ready with complete LaTeX support');
          MathJax.startup.defaultReady();
        }
      }
    };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>{{ site_title }}</h1>
            <p class="site-description">{{ site_description }}</p>
            <div class="header-controls">
                <button id="theme-toggle" class="theme-toggle" title="Toggle dark/light mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>
    
    <main class="container">
        <div class="all-dates">
            {{ all_dates_content }}
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>Data sourced from <a href="https://arxiv.org/" target="_blank">ArXiv.org</a></p>
            <p>Last updated: {{ last_updated }}</p>
        </div>
    </footer>
    
    <script src="js/script.js"></script>
</body>
</html>
