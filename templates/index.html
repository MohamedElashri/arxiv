<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_title }}</title>
    <meta name="description" content="{{ site_description }}">
    
    <!-- SEO Meta Tags -->
    <meta name="author" content="Mohamed Elashri">
    <meta name="keywords" content="arxiv, papers, research, physics, mathematics, computer science, daily papers, academic research">
    <meta name="robots" content="index, follow">
    <meta name="language" content="en">
    <meta name="revisit-after" content="1 day">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://melashri.net/arxiv-daily/">
    <meta property="og:title" content="{{ site_title }}">
    <meta property="og:description" content="{{ site_description }}">
    <meta property="og:site_name" content="ArXiv Daily">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://melashri.net/arxiv-daily/">
    <meta property="twitter:title" content="{{ site_title }}">
    <meta property="twitter:description" content="{{ site_description }}">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://melashri.net/arxiv-daily/">
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#2c3e50">
    <meta name="msapplication-TileColor" content="#2c3e50">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Remix Icons for theme toggle -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- KaTeX CSS and JS for fast LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" integrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71HotJqlAn" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" integrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfFr4dgmgccOTx" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false,
                errorColor: '#cc0000',
                macros: {
                    // Common physics and math macros
                    "\\RR": "\\mathbb{R}",
                    "\\CC": "\\mathbb{C}",
                    "\\NN": "\\mathbb{N}",
                    "\\ZZ": "\\mathbb{Z}",
                    "\\QQ": "\\mathbb{Q}",
                    "\\dd": "\\mathrm{d}",
                    "\\ee": "\\mathrm{e}",
                    "\\ii": "\\mathrm{i}",
                    "\\ket": "\\left|#1\\right\\rangle",
                    "\\bra": "\\left\\langle#1\\right|",
                    "\\braket": "\\left\\langle#1\\right\\rangle",
                    "\\norm": "\\left\\|#1\\right\\|",
                    "\\abs": "\\left|#1\\right|",
                    "\\tr": "\\operatorname{tr}",
                    "\\Tr": "\\operatorname{Tr}",
                    "\\rank": "\\operatorname{rank}",
                    "\\span": "\\operatorname{span}",
                    "\\dim": "\\operatorname{dim}",
                    "\\det": "\\operatorname{det}",
                    "\\sgn": "\\operatorname{sgn}",
                    "\\diag": "\\operatorname{diag}",
                    "\\Re": "\\operatorname{Re}",
                    "\\Im": "\\operatorname{Im}",
                    "\\Arg": "\\operatorname{Arg}",
                    "\\Log": "\\operatorname{Log}",
                    "\\lcm": "\\operatorname{lcm}",
                    "\\gcd": "\\operatorname{gcd}",
                    "\\ord": "\\operatorname{ord}",
                    "\\deg": "\\operatorname{deg}",
                    "\\ker": "\\operatorname{ker}",
                    "\\hom": "\\operatorname{hom}",
                    "\\end": "\\operatorname{end}",
                    "\\aut": "\\operatorname{aut}",
                    "\\inn": "\\operatorname{inn}",
                    "\\out": "\\operatorname{out}",
                    "\\Fix": "\\operatorname{Fix}",
                    "\\Stab": "\\operatorname{Stab}",
                    "\\Orb": "\\operatorname{Orb}",
                    "\\supp": "\\operatorname{supp}",
                    "\\cl": "\\operatorname{cl}",
                    "\\interior": "\\operatorname{int}",
                    "\\bd": "\\operatorname{bd}",
                    "\\grad": "\\nabla",
                    "\\curl": "\\nabla\\times",
                    "\\divergence": "\\nabla\\cdot",
                    "\\laplacian": "\\nabla^2",
                    "\\dalembertian": "\\Box",
                    "\\order": "\\mathcal{O}\\left(#1\\right)",
                    "\\bigO": "\\mathcal{O}\\left(#1\\right)",
                    "\\littleo": "o\\left(#1\\right)",
                    "\\expect": "\\left\\langle#1\\right\\rangle",
                    "\\expectation": "\\mathbb{E}\\left[#1\\right]",
                    "\\var": "\\operatorname{Var}\\left[#1\\right]",
                    "\\prob": "\\mathbb{P}\\left(#1\\right)",
                    "\\given": "\\mid",
                    "\\st": "\\mid",
                    "\\defeq": "\\stackrel{\\text{def}}{=}",
                    "\\eqdef": "\\stackrel{\\text{def}}{=}",
                    "\\const": "\\text{const}",
                    "\\half": "\\frac{1}{2}",
                    "\\third": "\\frac{1}{3}",
                    "\\quarter": "\\frac{1}{4}",
                    "\\inv": "^{-1}",
                    "\\trans": "^{\\top}",
                    "\\adj": "^{\\dagger}",
                    "\\conj": "^{*}",
                    "\\dual": "^{\\vee}",
                    "\\perp": "\\bot",
                    "\\parallel": "\\|",
                    "\\independent": "\\perp\\!\\!\\!\\perp",
                    "\\iid": "\\stackrel{\\text{iid}}{\\sim}",
                    "\\dist": "\\stackrel{\\text{d}}{=}",
                    "\\convd": "\\stackrel{\\text{d}}{\\to}",
                    "\\convp": "\\stackrel{\\text{p}}{\\to}",
                    "\\convas": "\\stackrel{\\text{a.s.}}{\\to}",
                    "\\weak": "\\rightharpoonup",
                    "\\strong": "\\rightarrow",
                    "\\floor": "\\left\\lfloor#1\\right\\rfloor",
                    "\\ceil": "\\left\\lceil#1\\right\\rceil",
                    "\\round": "\\left\\lfloor#1\\right\\rceil",
                    "\\set": "\\left\\{#1\\right\\}",
                    "\\card": "\\left|#1\\right|",
                    "\\powerset": "\\mathcal{P}\\left(#1\\right)",
                    "\\range": "\\operatorname{range}\\left(#1\\right)",
                    "\\domain": "\\operatorname{domain}\\left(#1\\right)",
                    "\\codomain": "\\operatorname{codomain}\\left(#1\\right)",
                    "\\image": "\\operatorname{image}\\left(#1\\right)",
                    "\\preimage": "\\operatorname{preimage}\\left(#1\\right)"
                }
            });
        });
    </script>
</head>
<body>
    <div class="header-container">
        <h1 class="header-title">
            <span class="header-title-preffix">ArXiv</span> {{ site_title }}
        </h1>
        <div class="theme-toggle-container">
            <label class="theme-switch">
                <input type="checkbox">
                <i id="theme-icon" class="ri-moon-line"></i>
            </label>
        </div>
    </div>
    
    {{ all_dates_content }}
    
    <footer>
        <p>Data sourced from <a href="https://arxiv.org/" target="_blank">ArXiv.org</a></p>
        <p>Last updated: {{ last_updated }}</p>
    </footer>
    
    <script src="js/script.js"></script>
</body>
</html>
