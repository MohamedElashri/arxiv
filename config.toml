[site]
title = "Daily Papers"
description = "Daily collection of papers from ArXiv in selected categories"
base_url = "https://melashri.net/arxiv"

[categories]
# ArXiv category codes and their display names
hep-ex = "High Energy Physics - Experiment"
hep-ph = "High Energy Physics - Phenomenology"
"stat.ML" = "Machine Learning - Statistics"
"cs.LG" = "Machine Learning"
nucl-ex = "Nuclear Physics - Experiment"
[settings]
# Number of days to keep papers (older papers will be cleaned up)
retention_days = 7
# Maximum number of papers per category per day
max_papers_per_category = 100
# Show only first N authors if more exist
max_authors_display = 3

[highlights]
# Words to highlight in paper titles (case-insensitive)
# Add words you want to highlight, otherwise keep empty
words = ["Allen","LHCb","charm","charmonium","trigger","FCC","FCC-ee",
"FCC-hh","LLM","flavor","flavour","reconstruction","rare decay","attention",
"tracks","tracking","benchmark","rare","vertex","locator", "FPGA", "FPGAs", "Monopole",
"Monopoles"]
